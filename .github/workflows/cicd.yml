name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIR"
          docker image prune --all --force
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt \
            -r requirements-dev.txt

      - name: Create FAISS index from data
        env:
          HF_EMBEDDING_MODEL: nomic-ai/nomic-embed-text-v1.5
          HF_EMBEDDING_DEVICE: cpu
          HF_EMBEDDING_BATCH_SIZE: 8
        run: python indexing/create_index.py

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build and start Docker Compose services
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          OLLAMA_HOST: https://ollama.com
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: gpt-oss:20b-cloud
          HF_EMBEDDING_MODEL: nomic-ai/nomic-embed-text-v1.5
          HF_EMBEDDING_DEVICE: cpu
          HF_EMBEDDING_BATCH_SIZE: 8
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: docker compose up -d --build

      - name: Verify running API and frontend
        run: |
          for attempt in {1..60}; do

            api_ready=false
            frontend_ready=false

            if curl \
              --fail \
              --silent \
              http://localhost:5000/api/health \
              > /dev/null; then

              api_ready=true

            fi


            if curl \
              --fail \
              --silent \
              http://localhost:5000/ \
              > /dev/null; then

              frontend_ready=true

            fi


            if [ "$api_ready" = true ] && [ "$frontend_ready" = true ]; then

              echo "API and frontend are ready."

              exit 0

            fi


            echo "Waiting for application..."

            sleep 2
          done
          
          echo "Application failed to become ready."

          docker compose ps

          docker compose logs
          exit 1

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: docker tag chatbot-rag:latest "$DOCKERHUB_USERNAME/chatbot-rag:latest" && docker push "$DOCKERHUB_USERNAME/chatbot-rag:latest"

      - name: Stop Docker Compose services
        if: always()
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          OLLAMA_HOST: https://ollama.com
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: gpt-oss:20b-cloud
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: docker compose down --volumes