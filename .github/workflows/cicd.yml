name: CI/CD

on:
  push:
    branches: [azure]
  # pull_request:
  #   branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt \
            -r requirements-dev.txt

      - name: Create FAISS index from data
        env:
          HF_EMBEDDING_MODEL: nomic-ai/nomic-embed-text-v1.5
          HF_EMBEDDING_DEVICE: cpu
          HF_EMBEDDING_BATCH_SIZE: 8
        run: python indexing/create_index.py

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run tests
        run: python -m pytest tests -q

  azure-deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      RESOURCE_GROUP: rag-chat-rg
      LOCATION: eastus
      ACR_NAME: ragchatacr2026
      AKS_NAME: ragchat-aks
      NAMESPACE: rag-chat
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Azure resource group
        run: az group create --name "$RESOURCE_GROUP" --location "$LOCATION"

      - name: Deploy Azure infrastructure with Bicep
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OLLAMA_HOST: https://ollama.com
          OLLAMA_MODEL: gpt-oss:20b-cloud
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              environmentName=ragchat \
              location=eastus \
              acrName="$ACR_NAME" \
              aksClusterName="$AKS_NAME" \
              logAnalyticsWorkspaceName=law-ragchat \
              grafanaName=grafana-ragchat \
              nodeCount=2 \
              vmSize=Standard_D4s_v5 \
              ollamaHost="$OLLAMA_HOST" \
              ollamaModel="$OLLAMA_MODEL" \
              mongoConnectionString="$MONGO_URI" \
              ollamaApiKey="$OLLAMA_API_KEY" \
              tavilyApiKey="$TAVILY_API_KEY" \
            --query properties.outputs

      - name: Build and push container image to ACR
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image rag-chat:latest \
            .

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$AKS_NAME" \
            --overwrite-existing

      - name: Create namespace and image pull secret
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GRAFANA_SMTP_USER: ${{ secrets.GRAFANA_SMTP_USER }}
          GRAFANA_SMTP_PASSWORD: ${{ secrets.GRAFANA_SMTP_PASSWORD }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          ACR_USERNAME=$(az acr credential show --name "$ACR_NAME" --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show --name "$ACR_NAME" --query passwords[0].value -o tsv)

          kubectl -n "$NAMESPACE" create secret docker-registry acr-secret \
            --docker-server="$ACR_LOGIN_SERVER" \
            --docker-username="$ACR_USERNAME" \
            --docker-password="$ACR_PASSWORD" \
            --docker-email=no-reply@example.com \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n "$NAMESPACE" create secret generic rag-secrets \
            --from-literal=MONGO_URI="$MONGO_URI" \
            --from-literal=OLLAMA_API_KEY="$OLLAMA_API_KEY" \
            --from-literal=TAVILY_API_KEY="$TAVILY_API_KEY" \
            --from-literal=GRAFANA_SMTP_USER="$GRAFANA_SMTP_USER" \
            --from-literal=GRAFANA_SMTP_PASSWORD="$GRAFANA_SMTP_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy application to AKS
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          cp k8s/azure/api.yaml /tmp/api.yaml
          sed -i "s#<ACR_LOGIN_SERVER>#$ACR_LOGIN_SERVER#g" /tmp/api.yaml
          kubectl -n "$NAMESPACE" apply -f /tmp/api.yaml
          kubectl -n "$NAMESPACE" apply -f k8s/azure/configmap.yaml
          kubectl -n "$NAMESPACE" apply -f k8s/azure/observability.yaml

      - name: Verify AKS deployment health
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/api --timeout=180s
          kubectl -n "$NAMESPACE" get svc api -n "$NAMESPACE"
          kubectl -n "$NAMESPACE" get pods
