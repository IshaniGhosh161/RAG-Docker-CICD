apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: rag-chat
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: rag-chat-api
        metrics_path: /metrics
        static_configs:
          - targets: [api:5000]
      - job_name: mongodb
        metrics_path: /metrics
        static_configs:
          - targets: [mongodb-exporter:9216]
  grafana-datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        editable: false
  grafana-dashboard-provider.yml: |
    apiVersion: 1
    providers:
      - name: RAG Chat dashboards
        orgId: 1
        folder: RAG Chat
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards