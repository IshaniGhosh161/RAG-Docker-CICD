apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: rag-chat
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: rag-chat
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-exporter
  namespace: rag-chat
  labels:
    app: mongodb-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-exporter
  template:
    metadata:
      labels:
        app: mongodb-exporter
    spec:
      containers:
        - name: mongodb-exporter
          image: percona/mongodb_exporter:0.53
          args:
            - --compatible-mode
            - --mongodb.direct-connect=false
            - --collector.dbstats
            - --collector.collstats
            - --mongodb.collstats-colls=chatbot.users,chatbot.sessions,chatbot.messages
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: MONGO_URI
          ports:
            - name: metrics
              containerPort: 9216
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-exporter
  namespace: rag-chat
spec:
  type: ClusterIP
  selector:
    app: mongodb-exporter
  ports:
    - name: metrics
      port: 9216
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: rag-chat
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.57.0
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: rag-chat
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: ui
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: rag-chat
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SMTP_ENABLED
              value: "true"
            - name: GF_SMTP_HOST
              value: smtp.gmail.com:587
            - name: GF_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: GRAFANA_SMTP_USER
            - name: GF_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: GRAFANA_SMTP_PASSWORD
            - name: GF_SMTP_FROM_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: GRAFANA_SMTP_USER
            - name: GF_SMTP_FROM_NAME
              value: Grafana Alerts
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: config
              mountPath: /etc/grafana/provisioning/datasources/grafana-datasource.yml
              subPath: grafana-datasource.yml
              readOnly: true
            - name: config
              mountPath: /etc/grafana/provisioning/dashboards/grafana-dashboard-provider.yml
              subPath: grafana-dashboard-provider.yml
              readOnly: true
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards/api-overview.json
              subPath: api-overview.json
              readOnly: true
      volumes:
        - name: grafana-data
          emptyDir: {}
        - name: config
          configMap:
            name: prometheus-config
        - name: dashboard
          configMap:
            name: grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: rag-chat
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
