apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: rag-chat
data:
  LOG_LEVEL: "INFO"
  LOG_FILE: "/app/log/api.log"
  HF_EMBEDDING_MODEL: "nomic-ai/nomic-embed-text-v1.5"
  HF_EMBEDDING_DEVICE: "cpu"
  HF_EMBEDDING_BATCH_SIZE: "8"
  FAST_MODE: "False"
  RETRIEVAL_K: "10"
  RERANK_TOP_N: "5"
  ENABLE_RERANKER: "True"
  OLLAMA_HOST: "https://ollama.com"
  OLLAMA_MODEL: "gpt-oss:20b-cloud"
  OTEL_SERVICE_NAME: "rag-chat-api"
  MONGO_TELEMETRY_DATABASE: "chatbot"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: rag-chat
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: rag-chat-api
        metrics_path: /metrics

        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - rag-chat

        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: api

          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running

          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: $1:5000

          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod

      - job_name: mongodb
        metrics_path: /metrics
        static_configs:
          - targets: [mongodb-exporter:9216]
  grafana-datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
  grafana-dashboard-provider.yml: |
    apiVersion: 1
    providers:
      - name: RAG Chat dashboards
        orgId: 1
        folder: RAG Chat
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards
