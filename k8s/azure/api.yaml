apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: rag-chat
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: api
          image: <ACR_LOGIN_SERVER>/rag-chat:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: rag-config
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: MONGO_URI
            - name: OLLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: OLLAMA_API_KEY
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: TAVILY_API_KEY
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger:4318/v1/traces
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: api-log
              mountPath: /app/log
      volumes:
        - name: api-log
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: rag-chat
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: LoadBalancer
