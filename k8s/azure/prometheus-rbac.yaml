apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: rag-chat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: rag-chat
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: rag-chat
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: rag-chat
roleRef:
  kind: Role
  name: prometheus
  apiGroup: rbac.authorization.k8s.io