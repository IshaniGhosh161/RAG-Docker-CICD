services:
  api:
    build: .
    image: ${DOCKERHUB_IMAGE:-chatbot-rag}:latest
    command: gunicorn --bind 0.0.0.0:5000 --workers 1 --threads 4 --timeout 300 api:app
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: ${MONGO_URI:?MONGO_URI must be set in .env}
      LOG_FILE: /app/log/api.log
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./log:/app/log

  ui:
    image: ${DOCKERHUB_IMAGE:-chatbot-rag}:latest
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8502
    ports:
      - "8502:8502"
    environment:
      API_BASE_URL: http://api:5000
      LOG_FILE: /app/log/ui.log
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8502/_stcore/health')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - ./log:/app/log
    depends_on:
      api:
        condition: service_healthy
