services:
  api:
    build: .
    image: ${DOCKERHUB_IMAGE:-chatbot-rag}:latest
    command: uvicorn backend.api:app --host 0.0.0.0 --port 5000 --workers 1
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: ${MONGO_URI:?MONGO_URI must be set in .env}
      LOG_FILE: /app/log/api.log
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      OTEL_SERVICE_NAME: rag-chat-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./log:/app/log

  prometheus:
    image: prom/prometheus:v3.5.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.57.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  grafana-data:
